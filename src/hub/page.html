<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>devbox hub</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2310120f'/%3E%3Cpath d='M12 12 6.5 7M12 12l5.5-5M12 12v6.5' stroke='%23ececea' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='12' r='2.6' fill='%23ececea'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light dark;
        --paper: light-dark(#f5f5f4, #10120f);
        --card: light-dark(#ffffff, #171a16);
        --ink: light-dark(#181d16, #ececea);
        --muted: light-dark(#5f675b, #a9aba6);
        --faint: light-dark(#737b6f, #868a82);
        --rule: light-dark(#181d161f, #ececea1f);
        --tint: light-dark(#181d160a, #ececea0a);
        --press: light-dark(#181d1614, #ececea14);
        --off: light-dark(#181d1633, #ececea33);
        --ok: light-dark(oklch(55% 0.15 160), oklch(76.5% 0.177 163.223));
        --warn: light-dark(oklch(58% 0.15 70), oklch(82.8% 0.189 84.429));
        --sans:
          "Suisse Intl", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue",
          Arial, sans-serif;
        --mono:
          "GT Mechanik Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --ease-rise: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.4 var(--sans);
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .app {
        max-width: 1120px;
        margin: 0 auto;
        padding: 20px 24px 56px;
      }

      h1,
      h2,
      p,
      dl,
      dd {
        margin: 0;
      }

      /* Top bar */
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 36px;
        margin-bottom: 40px;
      }

      .brand {
        display: flex;
        align-items: center;
        flex: none;
        gap: 10px;
        font-weight: 600;
        white-space: nowrap;
      }

      .brand svg {
        display: block;
        border-radius: 7px;
      }

      .sync {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .updated {
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 200ms ease;
      }

      .updated[data-stale] {
        color: var(--warn);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 13px 0 11px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-size: 13.5px;
        font-weight: 500;
        letter-spacing: inherit;
        cursor: pointer;
        transition:
          transform 160ms var(--ease-out),
          background-color 150ms ease;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn svg {
        display: block;
      }

      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      /* Title and filters */
      .title {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 16px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 28px;
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      .caption {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 14px;
      }

      .filter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: inherit;
        cursor: pointer;
        transition:
          transform 160ms var(--ease-out),
          background-color 150ms ease,
          color 150ms ease;
      }

      .filter:active {
        transform: scale(0.97);
      }

      .filter[aria-pressed="true"] {
        background: var(--press);
        color: var(--ink);
      }

      .filter .count {
        color: var(--faint);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      /* Card */
      .card {
        border: 1px solid var(--rule);
        border-radius: 14px;
        background: var(--card);
      }

      .card + .card {
        margin-top: 14px;
      }

      .summary {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px 40px;
        padding: 22px 24px 24px;
      }

      .big {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }

      .big .num {
        font-size: 46px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.035em;
        font-variant-numeric: tabular-nums;
      }

      .big .of {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 44px;
      }

      .stats dt {
        color: var(--muted);
        font-size: 13px;
      }

      .stats dd {
        margin-top: 2px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .stats dd .dim {
        color: var(--muted);
        font-weight: 400;
      }

      .notice {
        margin: 0 24px 20px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--tint);
        color: var(--muted);
        font-size: 13.5px;
      }

      /* Rows */
      .rows {
        border-top: 1px solid var(--rule);
      }

      .head,
      .row {
        display: grid;
        grid-template-columns:
          minmax(150px, 1fr) minmax(220px, 1.6fr) minmax(140px, 1.1fr) minmax(150px, 0.95fr)
          190px;
        column-gap: 24px;
        align-items: center;
        padding: 0 24px;
      }

      .head {
        height: 38px;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .head > :last-child {
        text-align: right;
      }

      .row {
        min-height: 66px;
        padding-top: 12px;
        padding-bottom: 12px;
        border-top: 1px solid var(--rule);
        transition: background-color 150ms ease;
      }

      .row:last-child {
        border-radius: 0 0 13px 13px;
      }

      .cell {
        min-width: 0;
      }

      .line {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }

      .name {
        overflow: hidden;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sub {
        display: block;
        margin-top: 2px;
        overflow: hidden;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cell-machine .sub {
        padding-left: 18px;
      }

      .none {
        color: var(--faint);
      }

      .mono {
        font-family: var(--mono);
        font-size: 12.5px;
        letter-spacing: 0;
      }

      .dot {
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        border: 1.5px solid var(--faint);
        transition:
          background-color 200ms ease,
          border-color 200ms ease,
          box-shadow 200ms ease;
      }

      .dot[data-s="online"] {
        border-color: var(--muted);
        background: var(--muted);
      }

      .dot[data-s="t3"] {
        border-color: var(--ok);
        background: var(--ok);
        box-shadow: 0 0 0 3px color-mix(in oklab, var(--ok) 22%, transparent);
      }

      .chip {
        flex: none;
        padding: 3px 6px 2px;
        border-radius: 5px;
        background: var(--press);
        color: var(--muted);
        font: 10.5px/1 var(--mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .address {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        max-width: 100%;
        margin: -3px -6px;
        padding: 3px 6px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        cursor: copy;
        text-align: left;
        transition:
          transform 160ms var(--ease-out),
          background-color 150ms ease;
      }

      .address:active {
        transform: scale(0.98);
      }

      .address .text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition:
          opacity 200ms ease,
          filter 200ms ease;
      }

      .address .said {
        position: absolute;
        top: 50%;
        left: 6px;
        color: var(--ok);
        font: 500 12.5px/1 var(--sans);
        letter-spacing: -0.01em;
        opacity: 0;
        filter: blur(2px);
        transform: translateY(-50%);
        transition:
          opacity 200ms ease,
          filter 200ms ease;
      }

      .address[data-copied] .text {
        opacity: 0;
        filter: blur(2px);
      }

      .address[data-copied] .said {
        opacity: 1;
        filter: blur(0);
      }

      .open {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        max-width: 100%;
        color: inherit;
        text-decoration: none;
        text-underline-offset: 3px;
        text-decoration-color: var(--off);
      }

      .open .text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .open svg {
        flex: none;
        color: var(--faint);
        transition:
          transform 160ms var(--ease-out),
          color 150ms ease;
      }

      .cell-history {
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }

      .strip {
        display: grid;
        grid-template-columns: repeat(48, 1fr);
        gap: 2px;
        height: 20px;
      }

      .strip i {
        border-radius: 1.5px;
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--rule);
        transition: background-color 200ms ease;
      }

      .strip i[data-s="0"] {
        background: var(--off);
        box-shadow: none;
      }

      .strip i[data-s="1"] {
        background: var(--faint);
        box-shadow: none;
      }

      .strip i[data-s="2"] {
        background: var(--ok);
        box-shadow: none;
      }

      .cell-history .sub {
        text-align: right;
      }

      .state[data-s="t3"] {
        color: var(--ink);
      }

      .row[data-s="offline"] .cell-machine .name {
        color: var(--muted);
      }

      .empty {
        padding: 28px 24px;
        border-top: 1px solid var(--rule);
        color: var(--muted);
      }

      /* For agents */
      .agents {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
        gap: 20px 40px;
        align-items: center;
        padding: 22px 24px;
      }

      h2 {
        font-size: 15px;
        font-weight: 500;
      }

      .agents p {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13.5px;
        text-wrap: pretty;
      }

      .agents p code {
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0;
      }

      .snippets {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .snippet {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        height: 38px;
        padding: 0 5px 0 13px;
        border-radius: 9px;
        background: var(--tint);
      }

      .snippet code {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .snippet .prompt {
        color: var(--faint);
        user-select: none;
      }

      .copy {
        position: relative;
        flex: none;
        height: 28px;
        min-width: 62px;
        padding: 0 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font: 500 12.5px/1 var(--sans);
        letter-spacing: -0.01em;
        cursor: pointer;
        transition:
          transform 160ms var(--ease-out),
          background-color 150ms ease,
          color 150ms ease;
      }

      .copy:active {
        transform: scale(0.97);
      }

      .copy span {
        display: block;
        transition:
          opacity 200ms ease,
          filter 200ms ease;
      }

      .copy .done {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--ok);
        opacity: 0;
        filter: blur(2px);
      }

      .copy[data-copied] .idle {
        opacity: 0;
        filter: blur(2px);
      }

      .copy[data-copied] .done {
        opacity: 1;
        filter: blur(0);
      }

      .foot {
        margin-top: 18px;
        padding: 0 2px;
        color: var(--faint);
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
      }

      @media (hover: hover) and (pointer: fine) {
        .btn:hover,
        .filter:hover:not([aria-pressed="true"]),
        .row:hover,
        .address:hover {
          background-color: var(--tint);
        }

        .copy:hover {
          background-color: var(--press);
          color: var(--ink);
        }

        .open:hover {
          text-decoration: underline;
          text-decoration-color: var(--off);
        }

        .open:hover svg {
          color: var(--ink);
          transform: translate(1px, -1px);
        }
      }

      /* One entrance, on first paint only. Rows that arrive on a later poll do not replay it. */
      .rise {
        animation: rise 600ms var(--ease-rise) both;
        animation-delay: calc(var(--i, 0) * 45ms);
      }

      @keyframes rise {
        from {
          opacity: 0;
          filter: blur(3px);
          transform: translateY(12px);
        }
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .rise {
          animation: fade 200ms ease both;
          animation-delay: 0ms;
        }

        .btn:active,
        .filter:active,
        .copy:active,
        .address:active {
          transform: none;
        }
      }

      @media (max-width: 1020px) {
        .app {
          padding: 16px 16px 40px;
        }

        .top {
          margin-bottom: 28px;
        }

        .btn .label {
          display: none;
        }

        .btn {
          width: 34px;
          padding: 0;
          justify-content: center;
        }

        .summary {
          padding: 20px 16px;
        }

        .notice {
          margin: 0 16px 16px;
        }

        .head {
          display: none;
        }

        .row {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          gap: 12px 16px;
          align-items: start;
          padding: 16px;
        }

        .cell-machine,
        .cell-history {
          grid-column: 1 / -1;
        }

        .cell[data-label]::before {
          content: attr(data-label);
          display: block;
          margin-bottom: 5px;
          color: var(--faint);
          font: 10.5px/1 var(--mono);
          letter-spacing: 0.06em;
          text-transform: uppercase;
        }

        .cell-where {
          grid-column: 1 / -1;
        }

        .agents {
          grid-template-columns: minmax(0, 1fr);
          padding: 20px 16px;
        }

        .empty {
          padding: 24px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top rise" style="--i: 0">
        <div class="brand">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="24" height="24" rx="6" fill="var(--ink)" />
            <path
              d="M12 12 6.5 7M12 12l5.5-5M12 12v6.5"
              stroke="var(--paper)"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <circle cx="12" cy="12" r="2.6" fill="var(--paper)" />
          </svg>
          <span>devbox hub</span>
        </div>
        <div class="sync">
          <span id="updated" class="updated" role="status"></span>
          <button id="refresh" class="btn" type="button" aria-label="Refresh">
            <svg
              id="refreshIcon"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 4v5h-5" />
            </svg>
            <span class="label">Refresh</span>
          </button>
        </div>
      </header>

      <div class="title rise" style="--i: 1">
        <h1>Machines</h1>
        <p id="caption" class="caption"></p>
      </div>

      <div
        id="filters"
        class="filters rise"
        style="--i: 2"
        role="group"
        aria-label="Filter machines"
      ></div>

      <section class="card rise" style="--i: 3" aria-label="Machines">
        <div class="summary">
          <div class="big">
            <span id="big" class="num">0</span>
            <span id="bigOf" class="of"></span>
          </div>
          <dl id="stats" class="stats"></dl>
        </div>
        <p id="notice" class="notice" hidden></p>
        <div class="rows">
          <div class="head" aria-hidden="true">
            <span>Machine</span>
            <span>Where</span>
            <span>T3 Code</span>
            <span>Agent link</span>
            <span>Last 24 h</span>
          </div>
          <div id="rows"></div>
          <p id="empty" class="empty" hidden>No machine matches this filter.</p>
        </div>
      </section>

      <section class="card agents rise" style="--i: 9" aria-labelledby="agentsTitle">
        <div>
          <h2 id="agentsTitle">For agents</h2>
          <p>
            The same list as JSON. An agent reads it before it picks a machine, then reaches a
            linked one by its <code>environmentId</code>.
          </p>
        </div>
        <div class="snippets">
          <div class="snippet mono">
            <code
              ><span class="prompt">$ </span><span id="cmdCli">devbox machines --json</span></code
            >
            <button class="copy" type="button" data-copy="cmdCli">
              <span class="idle">Copy</span><span class="done" aria-hidden="true">Copied</span>
            </button>
          </div>
          <div class="snippet mono">
            <code><span class="prompt">$ </span><span id="cmdHttp"></span></code>
            <button class="copy" type="button" data-copy="cmdHttp">
              <span class="idle">Copy</span><span class="done" aria-hidden="true">Copied</span>
            </button>
          </div>
        </div>
      </section>

      <footer class="foot rise" style="--i: 10">
        <span id="generated"></span>
      </footer>
    </div>

    <script id="snapshot" type="application/json">
      "__DEVBOX_SNAPSHOT__"
    </script>
    <script>
      (() => {
        "use strict";

        const POLL_MS = 15000;
        const BARS = 48;
        const BAR_SECONDS = 1800;
        const STATE_TEXT = { t3: "T3 Code ready", online: "Online", offline: "Offline" };
        const FILTERS = [
          { key: "all", label: "All", test: () => true },
          { key: "t3", label: "T3 Code", test: (m) => m.state === "t3" },
          { key: "online", label: "Online", test: (m) => m.state !== "offline" },
          { key: "offline", label: "Offline", test: (m) => m.state === "offline" },
        ];
        const ARROW =
          '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';

        const $ = (id) => document.getElementById(id);
        const el = (tag, className, text) => {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        };

        const span = (ms) => {
          const seconds = Math.max(0, Math.round(ms / 1000));
          if (seconds < 60) return `${seconds}s`;
          const minutes = Math.round(seconds / 60);
          if (minutes < 60) return `${minutes}m`;
          const hours = Math.round(minutes / 60);
          if (hours < 48) return `${hours}h`;
          return `${Math.round(hours / 24)}d`;
        };
        const ago = (iso, now) => `${span(now - Date.parse(iso))} ago`;
        const plural = (count, word) => `${count} ${word}${count === 1 ? "" : "s"}`;

        const readSnapshot = () => {
          try {
            const parsed = JSON.parse($("snapshot").textContent);
            return parsed && typeof parsed === "object" ? parsed : null;
          } catch {
            return null;
          }
        };

        // navigator.clipboard needs a secure context, and a hub on a tailnet address is plain http.
        const copyText = async (text) => {
          try {
            await navigator.clipboard.writeText(text);
            return;
          } catch {}
          const area = el("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.cssText = "position:fixed;top:0;left:0;opacity:0";
          document.body.append(area);
          area.select();
          document.execCommand("copy");
          area.remove();
        };

        const flashCopied = (node) => {
          clearTimeout(node.copiedTimer);
          node.dataset.copied = "";
          node.copiedTimer = setTimeout(() => delete node.dataset.copied, 1600);
        };

        const bars = (states, sampleSeconds) => {
          const per = Math.max(1, Math.round(BAR_SECONDS / sampleSeconds));
          return Array.from({ length: BARS }, (_, bar) => {
            const end = states.length - (BARS - 1 - bar) * per;
            let worst = "";
            for (let i = Math.max(0, end - per); i < end; i += 1) {
              const state = states[i];
              if (state !== " " && (worst === "" || state < worst)) worst = state;
            }
            return worst;
          });
        };

        const hostOf = (url) => {
          try {
            return new URL(url).host;
          } catch {
            return url;
          }
        };

        const whereDetail = (m) => {
          if (m.tailscale) return m.tailscale.ip;
          const url = m.t3 && m.t3.link && m.t3.link.urls[0];
          return url ? hostOf(url) : "";
        };

        const linkText = (link) => {
          if (!link) return "Not linked";
          return link.status === "reachable" ? "Linked" : `Linked, ${link.status}`;
        };

        const stateText = (m, now) => {
          if (m.state === "t3" && m.t3 && m.t3.latencyMs !== null)
            return `${STATE_TEXT.t3} · ${Math.round(m.t3.latencyMs)} ms`;
          if (m.state === "offline" && m.tailscale && m.tailscale.lastSeen)
            return `Offline · seen ${ago(m.tailscale.lastSeen, now)}`;
          return STATE_TEXT[m.state];
        };

        const makeRow = () => {
          const node = el("div", "row");
          node.setAttribute("role", "row");

          const machine = el("div", "cell cell-machine");
          const nameLine = el("div", "line");
          const dot = el("span", "dot");
          const name = el("span", "name");
          const here = el("span", "chip", "here");
          nameLine.append(dot, name, here);
          const os = el("span", "sub");
          machine.append(nameLine, os);

          const where = el("div", "cell cell-where");
          where.dataset.label = "Where";
          const address = el("button", "address mono");
          address.type = "button";
          const addressText = el("span", "text");
          const said = el("span", "said", "Copied");
          said.setAttribute("aria-hidden", "true");
          address.append(addressText, said);
          address.addEventListener("click", () => {
            copyText(addressText.textContent).then(() => flashCopied(address));
          });
          const noAddress = el("span", "none", "Not on the tailnet");
          const ip = el("span", "sub mono");
          where.append(address, noAddress, ip);

          const t3 = el("div", "cell");
          t3.dataset.label = "T3 Code";
          const open = el("a", "open");
          open.target = "_blank";
          open.rel = "noreferrer";
          const openText = el("span", "text");
          open.append(openText);
          open.insertAdjacentHTML("beforeend", ARROW);
          const label = el("span", "name");
          const noT3 = el("span", "none", "Not found");
          const version = el("span", "sub mono");
          t3.append(open, label, noT3, version);

          const link = el("div", "cell");
          link.dataset.label = "Agent link";
          const linkStatus = el("span");
          const linkDetail = el("span", "sub");
          link.append(linkStatus, linkDetail);

          const history = el("div", "cell cell-history");
          const strip = el("div", "strip");
          strip.setAttribute("role", "img");
          const ticks = Array.from({ length: BARS }, () => el("i"));
          strip.append(...ticks);
          const state = el("span", "sub state");
          history.append(strip, state);

          node.append(machine, where, t3, link, history);

          const update = (m, states, sampleSeconds, now) => {
            node.dataset.s = m.state;
            dot.dataset.s = m.state;
            name.textContent = m.name;
            here.hidden = !m.here;
            os.textContent = m.tailscale ? m.tailscale.os : "linked by URL";

            address.hidden = !m.tailscale;
            noAddress.hidden = Boolean(m.tailscale);
            if (m.tailscale) {
              addressText.textContent = m.tailscale.dns;
              address.title = m.tailscale.dns;
              address.setAttribute("aria-label", `Copy ${m.tailscale.dns}`);
            }
            ip.textContent = whereDetail(m);

            const reachable = Boolean(m.t3 && m.t3.url);
            open.hidden = !reachable;
            label.hidden = !m.t3 || reachable;
            noT3.hidden = Boolean(m.t3);
            if (m.t3) {
              openText.textContent = m.t3.label;
              label.textContent = m.t3.label;
              open.title = m.t3.label;
              label.title = m.t3.label;
              if (reachable) open.href = m.t3.url;
            }
            version.textContent = m.t3 && m.t3.version ? m.t3.version : "";
            version.title = version.textContent;

            const linked = m.t3 && m.t3.link;
            linkStatus.className = linked ? "" : "none";
            linkStatus.textContent = linkText(linked);
            linkDetail.textContent = linked
              ? `${linked.access} · ${span(Date.parse(linked.expiresAt) - now)} left`
              : "";

            const marks = bars(states, sampleSeconds);
            ticks.forEach((tick, i) => {
              if (marks[i] === "") delete tick.dataset.s;
              else tick.dataset.s = marks[i];
            });
            strip.setAttribute("aria-label", `${m.name}, last 24 hours`);

            state.dataset.s = m.state;
            state.textContent = stateText(m, now);
          };

          return { node, update };
        };

        const rowsNode = $("rows");
        const rows = new Map();
        const filterButtons = new Map();
        let snapshot = readSnapshot();
        let filter = "all";
        let failing = false;
        let firstPaint = true;

        for (const { key, label } of FILTERS) {
          const button = el("button", "filter");
          button.type = "button";
          button.append(el("span", "", label), el("span", "count", "0"));
          button.addEventListener("click", () => {
            filter = key;
            render();
          });
          filterButtons.set(key, button);
          $("filters").append(button);
        }

        const stat = (term, value, dim) => {
          const group = el("div");
          const dd = el("dd", "", value);
          if (dim) dd.append(el("span", "dim", ` ${dim}`));
          group.append(el("dt", "", term), dd);
          return group;
        };

        const render = () => {
          if (!snapshot) return;
          const now = Date.now();
          const machines = snapshot.machines;
          const online = machines.filter((m) => m.state !== "offline").length;
          const ready = machines.filter((m) => m.state === "t3");
          const linked = machines.filter((m) => m.t3 && m.t3.link);

          $("caption").textContent =
            `${plural(machines.length, "machine")} · ${ready.length} running T3 Code`;
          $("big").textContent = String(online);
          $("bigOf").textContent = `of ${machines.length} online`;

          const nextExpiry = linked
            .map((m) => ({ name: m.name, at: Date.parse(m.t3.link.expiresAt) }))
            .sort((a, b) => a.at - b.at)[0];
          const slowest = ready
            .filter((m) => m.t3.latencyMs !== null)
            .sort((a, b) => b.t3.latencyMs - a.t3.latencyMs)[0];
          $("stats").replaceChildren(
            stat("T3 Code", `${ready.length} ready`),
            stat("Linked for agents", String(linked.length)),
            stat(
              "Next link to renew",
              nextExpiry ? `in ${span(nextExpiry.at - now)}` : "None",
              nextExpiry ? nextExpiry.name : "",
            ),
            stat(
              "Slowest answer",
              slowest ? `${Math.round(slowest.t3.latencyMs)} ms` : "None",
              slowest ? slowest.name : "",
            ),
          );

          const notice = $("notice");
          notice.hidden = snapshot.tailscale;
          notice.textContent =
            "Tailscale did not answer on the hub machine, so this list holds only that machine and its links.";

          for (const { key, test } of FILTERS) {
            const button = filterButtons.get(key);
            button.setAttribute("aria-pressed", String(key === filter));
            button.lastChild.textContent = String(machines.filter(test).length);
          }

          const history = snapshot.history;
          const active = FILTERS.find((f) => f.key === filter);
          const seen = new Set();
          let shown = 0;
          machines.forEach((m, index) => {
            seen.add(m.name);
            let row = rows.get(m.name);
            if (!row) {
              row = makeRow();
              rows.set(m.name, row);
              if (firstPaint) {
                row.node.classList.add("rise");
                row.node.style.setProperty("--i", String(4 + Math.min(index, 6) * 0.7));
              }
            }
            row.update(
              m,
              (history && history.states[m.name]) || "",
              history ? history.sampleSeconds : 60,
              now,
            );
            const visible = active.test(m);
            row.node.hidden = !visible;
            if (visible) shown += 1;
            rowsNode.append(row.node);
          });
          for (const [name, row] of rows) {
            if (seen.has(name)) continue;
            row.node.remove();
            rows.delete(name);
          }
          $("empty").hidden = shown > 0;
          firstPaint = false;
          tick();
        };

        const tick = () => {
          const updated = $("updated");
          if (!snapshot) {
            updated.textContent = failing ? "The hub is not answering" : "";
            updated.toggleAttribute("data-stale", failing);
            return;
          }
          const checked = ago(snapshot.generatedAt, Date.now());
          updated.textContent = failing
            ? `The hub is not answering · checked ${checked}`
            : `Checked ${checked}`;
          updated.toggleAttribute("data-stale", failing);
          $("generated").textContent = `Each bar is 30 minutes. The hub checks every ${
            snapshot.history ? snapshot.history.sampleSeconds : 60
          } seconds and keeps the last 24 hours in memory.`;
        };

        const load = async () => {
          try {
            const response = await fetch("api/machines", { cache: "no-store" });
            if (!response.ok) throw new Error(String(response.status));
            snapshot = await response.json();
            failing = false;
            render();
          } catch {
            failing = true;
            tick();
          }
        };

        $("refresh").addEventListener("click", () => {
          if (!matchMedia("(prefers-reduced-motion: reduce)").matches)
            $("refreshIcon").animate(
              [{ transform: "rotate(0)" }, { transform: "rotate(360deg)" }],
              {
                duration: 500,
                easing: "cubic-bezier(0.77, 0, 0.175, 1)",
              },
            );
          load();
        });

        for (const button of document.querySelectorAll(".copy"))
          button.addEventListener("click", () => {
            copyText($(button.dataset.copy).textContent).then(() => flashCopied(button));
          });

        $("cmdHttp").textContent = `curl -s ${
          location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:3780"
        }/api/machines`;

        render();
        if (!snapshot) load();
        setInterval(tick, 1000);
        setInterval(() => {
          if (!document.hidden) load();
        }, POLL_MS);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) load();
        });
      })();
    </script>
  </body>
</html>
